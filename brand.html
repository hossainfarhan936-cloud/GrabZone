<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Brand Store</title>
<script>
/* A brand page opened without ?slug= used to render only "Store not found.".
   Send the visitor to the marketplace index instead of a dead end. */
(function(){
  try{
    var slug=new URLSearchParams(location.search).get('slug');
    if(!slug){ location.replace('/marketplace.html'); }
  }catch(e){}
})();
</script><link rel="stylesheet" href="/vendor.css"><style>.store{max-width:1200px;margin:auto;padding:20px}.banner{min-height:300px;border-radius:28px;overflow:hidden;background:#111;color:#fff;display:flex;align-items:flex-end;padding:30px;position:relative}.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}.banner>div{position:relative;z-index:1}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.product{border:1px solid #e8e8ed;border-radius:18px;overflow:hidden}.product img{width:100%;aspect-ratio:1;object-fit:cover;background:#f5f5f7}.p{padding:14px}@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}}</style><link rel="stylesheet" href="grabzone-mobile-global.css?v=20260922mobileglobal2"><script src="/grabzone-animation-controller.js?v=20260922full-animation1"></script>
  <link rel="stylesheet" href="grabzone-ui-consistency.css?v=20260923ui">
</head><body><main class="store"><a href="/marketplace.html" style="text-decoration:none;color:#555">← Marketplace</a><section id="banner" class="banner" style="margin-top:14px"></section><h2>Products</h2><div id="products" class="products"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=new URLSearchParams(location.search).get('slug')||'';const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');async function init(){const r=await fetch('/api/marketplace/store?slug='+encodeURIComponent(slug));const d=await r.json();if(!r.ok){document.body.innerHTML='<div class="gz-empty">Store not found.</div>';return}document.title=d.vendor.brand_name+' · GrabZone';const v=d.vendor,bg=v.banner_url?`background-image:url('${esc(v.banner_url)}')`:'';document.querySelector('#banner').setAttribute('style',`margin-top:14px;${bg};background-color:${esc(v.accent_color||'#111')}`);document.querySelector('#banner').innerHTML=`<div><div style="font-size:11px;letter-spacing:2px;font-weight:900">GRABZONE MARKETPLACE</div><h1 style="font-size:48px;margin:8px 0">${esc(v.brand_name)}</h1><p style="max-width:700px;color:#eee;line-height:1.6">${esc(v.description||v.tagline||'')}</p></div>`;document.querySelector('#products').innerHTML=(d.products||[]).map(p=>`<article class="product"><img src="${esc(p.image_url)}"><div class="p"><b>${esc(p.name)}</b><div style="margin-top:6px;font-weight:900">${money(p.price)}</div></div></article>`).join('')||'<div class="gz-empty">No published products yet.</div>'}init();</script><script src="grabzone-mobile-app-shell.js?v=20260922mobileapp1"></script></body></html>
