<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>পেজটি পাওয়া যায়নি — GrabZone</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=Noto+Sans+Bengali:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;padding:32px 18px;
    font-family:'Inter','Noto Sans Bengali',system-ui,sans-serif;color:#fff;
    background:#10161d;
    background-image:radial-gradient(1000px 560px at 82% -10%,rgba(255,106,0,.42),transparent 62%),
                     radial-gradient(720px 500px at -10% 110%,rgba(255,106,0,.20),transparent 60%)}
  .card{width:100%;max-width:620px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:28px}
  .mark{width:46px;height:46px;border-radius:14px;background:#fff;color:#ff6a00;
    display:grid;place-items:center;font-weight:900;font-size:22px}
  .brand b{font-size:20px;font-weight:900;letter-spacing:-.03em}
  .code{font-size:74px;font-weight:900;line-height:1;letter-spacing:-.05em;color:#ff6a00}
  .code small{display:block;font-size:12px;letter-spacing:.28em;color:rgba(255,255,255,.55);margin-top:10px}
  h1{font-family:'Noto Sans Bengali',sans-serif;font-size:29px;font-weight:800;margin:20px 0 12px;line-height:1.4}
  p{font-family:'Noto Sans Bengali',sans-serif;font-size:16px;line-height:1.75;color:rgba(255,255,255,.76)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
  a.btn{border-radius:999px;padding:15px 26px;font-weight:800;font-size:15px;text-decoration:none;
    font-family:'Noto Sans Bengali',sans-serif}
  .primary{background:#ff6a00;color:#fff;box-shadow:0 16px 38px rgba(255,106,0,.38)}
  .ghost{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.22)}
  .foot{margin-top:30px;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.06em}
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">G</span><b>GrabZone</b></div>

    <div class="code">404<small>PAGE NOT FOUND</small></div>

    <h1>দুঃখিত, পেজটি খুঁজে পাওয়া যায়নি</h1>
    <p>লিংকটি হয়তো ভুল, অথবা পেজটি সরিয়ে ফেলা হয়েছে। নিচের বাটন থেকে স্টোরে ফিরে গিয়ে পছন্দের পণ্য খুঁজে নিন।</p>

    <div class="actions">
      <a class="btn primary" href="/">স্টোরে ফিরে যান</a>
      <a class="btn ghost" href="/#shop">পণ্য দেখুন</a>
      <a class="btn ghost" href="/track-order.html">অর্ডার ট্র্যাক করুন</a>
    </div>

    <div class="foot">grabzone.tech · Grab it. Love it.</div>
  </main>
</body>
</html>
