uto;padding:0 28px 80px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.product{background:#fff;border:1px solid #e4ded6;border-radius:15px;overflow:hidden;box-shadow:0 6px 20px rgba(31,24,17,.04)}.image{display:block;background:#f3f2ef}.image img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.info{padding:12px}.info small{display:inline-block;padding:4px 7px;border-radius:999px;background:#fff0e7;color:#ed5608;font-size:7px;font-weight:900}.info a.name{display:block;margin:8px 0 12px;min-height:32px;color:#161b22;text-decoration:none;font-size:11px;font-weight:800;line-height:1.4}.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-size:14px;font-weight:900}.add{border:0;border-radius:7px;background:#111;color:#fff;padding:8px 9px;font-size:8px;font-weight:900;cursor:pointer}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;background:#fff;border:1px dashed #ddd;border-radius:14px;color:#777}.footer{text-align:center;padding:35px;color:#888;font-size:9px;border-top:1px solid #e7e4df;background:#fff}@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.store-banner{aspect-ratio:3/1;height:auto;border-radius:16px}.store-logo{left:18px;width:64px;height:64px;bottom:-25px}.store-logo span{width:34px;height:34px;font-size:15px}.hero-copy{padding-top:38px}.store-top{padding:10px 14px}.logo{font-size:19px}.logo img{width:34px;height:34px}.back{padding:9px 12px}.hero{padding:40px 14px 28px}.hero h1{font-size:42px}.hero p{font-size:12px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 14px 55px}.info{padding:10px}.info a.name{font-size:11px}.price{font-size:13px}.add{padding:9px 8px;min-height:40px}}

<!--
  Shared cart drawer. This page already calls window.GrabZoneCart.open() from its
  own "🛒 Cart" button, but cart.js was never loaded here, so the button fell
  through to /checkout and there was no way to review or remove a line. cart.js
  is the same drawer the storefront uses, reads and writes the same
  grabzone_cart_v2 key, and is responsive (bottom sheet on phones).

<script src="/cart.js?v=20260924-color-swatches-v2"></script>

<body><div id="app"></div>
<script>
(()=>{const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');const CART='grabzone_cart_v2';const read=()=>{try{const x=JSON.parse(localStorage.getItem(CART)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};const write=x=>{localStorage.setItem(CART,JSON.stringify(x));window.dispatchEvent(new Event('grabzone-cart-updated'))};const img=p=>p?.image_url||'/favicon.png';async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Store unavailable')}return r.json()}function add(p){if(String(p.product_type||'').toLowerCase()==='variable'){location.href='/product.html?id='+encodeURIComponent(p.id);return}const c=read(),id=String(p.id),f=c.find(x=>String(x.product_id||x.id)===id);if(f)f.quantity=Number(f.quantity||1)+1;else c.push({product_id:p.id,id:p.id,name:p.name,price:Number(p.sale_price||p.price||0),image_url:img(p),quantity:1,vendor_id:p.vendor_id,vendor_slug:p.vendor_slug,vendor_name:p.vendor_name});write(c);toast('Added to cart')}function toast(t){let e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';e.style='position:fixed;right:18px;bottom:18px;z-index:9999;background:#111;color:#fff;padding:11px 15px;border-radius:9px;font-size:10px;font-weight:800';document.body.appendChild(e)}e.textContent=t;clearTimeout(window.__toast);e.style.opacity='1';window.__toast=setTimeout(()=>e.style.opacity='0',1500)}function render(v,products){document.title=(v.brand_name||v.business_name||'Store')+' — GrabZone';document.querySelector('#app').innerHTML='<div class="store-page"><header class="store-header"><div class="store-top"><a class="logo" href="/"><img src="/favicon.png" alt="GrabZone"><b>Grab<span>Zone</span></b></a><a class="back" href="/marketplace">← Choose Another Store</a><button class="cart" id="cart">🛒 Cart</button></div></header><main><section class="hero"><div class="store-banner" id="storeBanner"></div><div class="store-logo" id="storeLogo"></div><div class="hero-copy"><div class="eyebrow">GRABZONE STORE</div><h1>'+esc(v.brand_name||v.business_name||v.slug)+'</h1><p>'+(esc(v.description||'Shop products from this brand.'))+'</p></div></section><section class="products">'+(products.length?products.map(p=>'<article class="product"><a class="image" href="/product.html?id='+encodeURIComponent(p.id)+'"><img src="'+esc(img(p))+'" alt="'+esc(p.name)+'" loading="lazy" decoding="async"></a><div class="info"><small>'+esc(p.category||'Product')+'</small><a class="name" href="/product.html?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a><div class="price-row"><strong class="price">'+money(p.sale_price||p.price)+'</strong><button class="add" data-id="'+esc(p.id)+'">Add to Cart</button></div></div></article>').join(''):'<div class="empty">This store has no products available right now.</div>')+'</section></main><footer class="footer">GrabZone Marketplace · <a href="/marketplace" style="color:#f65b0a;text-decoration:none;font-weight:900">Choose another store</a></footer></div>';const banner=document.querySelector('#storeBanner'),logo=document.querySelector('#storeLogo');if(banner)banner.style.backgroundImage=v.banner_url?`url("${String(v.banner_url).replace(/"/g,'\\"')}")`:'';if(logo)logo.innerHTML=v.logo_url?`<img src="${esc(v.logo_url)}" alt="${esc(v.brand_name||v.business_name||'Store')} logo">`:`<span>${esc(String(v.brand_name||v.business_name||'S').charAt(0).toUpperCase())}</span>`;document.querySelector('#cart').onclick=()=>{if(window.GrabZoneCart?.open)window.GrabZoneCart.open();else location.href='/checkout.html'};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=products.find(x=>String(x.id)===String(b.dataset.id));if(p)add(p)})}async function init(){try{const slug=new URLSearchParams(location.search).get('slug')||'';if(!slug)throw Error('Store not selected');const d=await get('/api/marketplace/store?slug='+encodeURIComponent(slug));render(d.vendor,d.products||[])}catch(e){document.querySelector('#app').innerHTML='<div style="padding:70px 20px;text-align:center;font-family:system-ui"><h2>Store unavailable</h2><p>'+esc(e.message)+'</p><a href="/marketplace" style="color:#f65b0a;font-weight:800">← Choose another store</a></div>'}}init()})()
</script><script src="grabzone-mobile-app-shell.js?v=20260922mobileapp1"></script></body></html>
