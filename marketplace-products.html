<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Products — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js"></script>  <link rel="stylesheet" href="grabzone-ui-consistency.css?v=20260923ui">
</head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR PRODUCTS</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div class="gz-head"><div><h1>Vendor Products</h1><p>All marketplace inventory grouped by vendor.</p></div><button class="gz-btn light" onclick="load()">Refresh</button></div><div class="gz-card" style="overflow:auto"><table class="gz-table"><thead><tr><th>Product</th><th>Vendor</th><th>Category</th><th>Price</th><th>Stock</th><th>Published</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const $=s=>document.querySelector(s),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function api(p){const r=await fetch(p,{credentials:'include',cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function guard(){const a=await api('/api/admin-auth');if(!a||!a.authenticated){location.replace('/admin.html');throw new Error('Redirecting to sign in…')}}
async function load(){await guard();const d=await api('/api/marketplace/products?limit=500&scope=admin');$('#rows').innerHTML=(d.products||[]).map(p=>`<tr><td><b>${p.name}</b><div style="font-size:11px;color:#777">${p.sku||''}</div></td><td>${p.vendor_name}</td><td>${p.category||'—'}</td><td>${money(p.price)}</td><td>${Number(p.stock||0)}</td><td>${p.published?'Yes':'No'}</td><td><a class="gz-btn light" href="/marketplace-vendor-control.html?vendor=${encodeURIComponent(p.vendor_id)}">Vendor</a></td></tr>`).join('')||'<tr><td colspan="7">No marketplace products.</td></tr>'}load().catch(e=>{alert(e.message);location.href='/admin.html'})</script></body></html>
